server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota desconhecida devolve o index, senão recarregar em
  # /meus-ingressos daria 404 do Nginx em vez de abrir a aplicação.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets têm hash no nome, então podem ser cacheados sem prazo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
