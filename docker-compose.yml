# Ambiente local completo: banco, cache, API e front.
#
#   docker compose up --build
#   docker compose exec api alembic upgrade head
#   docker compose exec api python -m app.seed
#
# O front sobe em http://localhost:5173 e a API em http://localhost:8000.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: palco
      POSTGRES_PASSWORD: palco
      POSTGRES_DB: palco
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    # A API espera este healthcheck: sem ele o Uvicorn sobe antes do Postgres
    # aceitar conexão e morre no primeiro request.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U palco -d palco']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    ports:
      - '8000:8000'
    environment:
      # Hostnames de serviço do Compose, não localhost: dentro da rede do
      # Compose "localhost" seria o próprio contêiner da API.
      DATABASE_URL: postgresql+psycopg://palco:palco@db:5432/palco
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_BASE_URL: http://localhost:5173
      DEBUG: 'true'
      # Chaves opcionais: sem elas o catálogo usa as fixtures locais.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      # O entrypoint migra sempre e semeia se o banco estiver vazio, então
      # `docker compose up` já entrega o ambiente pronto para percorrer.
      SEED_ON_BOOT: 'true'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Código montado para ter recarga automática em desenvolvimento.
      - ./backend/app:/app/app
    # Sem `command`: usa o entrypoint da imagem, que aplica as migrations.

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  pgdata:
